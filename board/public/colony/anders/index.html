<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="colony" content="group-app"><title>NodeLink Dashboard (anders)</title>
<link rel="stylesheet" href="style.css"></head>
<body><main>
  <header>
    <h1>NodeLink: Mesh vs Gateway</h1>
    <span class="mode">mode <b id="mode">-</b></span>
    <div class="badges" id="badges"></div>
  </header>
  <div class="grid">
    <div>
      <div class="card">
        <h2>Topology</h2>
        <svg id="topo" viewBox="0 0 520 380"><g id="links"></g><g id="flow"></g><g id="nodes"></g></svg>
        <div class="hint">Click a node to target chaos at it.</div>
      </div>
      <div class="card"><h2>Events</h2><div id="log"></div></div>
    </div>
    <div>
      <div class="card">
        <h2>Mesh vs Gateway</h2>
        <table id="metrics"></table>
        <table id="lastrun"></table>
        <div class="hint">Per-mode end-to-end results of the last run (farzad lastRun); live window when no run exists. Green is the better mode.</div>
      </div>
      <div class="card" id="controls">
        <h2>Controls</h2>
        <div class="row"><label>Mode</label>
          <button data-mode="mesh">Mesh</button><button data-mode="gateway">Gateway</button></div>
        <div class="row"><label>Nodes</label>
          <input type="number" id="nodeCount" min="3" max="20" value="5"><button id="reset">Reset cluster</button>
          <button id="add">+ Add node</button><button id="remove">Remove selected</button></div>
        <div class="row"><label>Traffic</label>
          <input type="range" id="rate" min="0" max="200" value="20"><span id="rateVal">20</span>/s</div>
        <div class="row"><label>Mix %</label>
          req <input type="number" id="mixReq" value="60"> one-way <input type="number" id="mixOne" value="30">
          bcast <input type="number" id="mixB" value="10"></div>
        <div class="row"><label>Payload</label><input type="number" id="payload" value="256"> bytes
          <button id="traffic">Apply</button><button id="stop">Stop</button></div>
        <div class="row"><label>Chaos</label><span id="sel" class="hint">no node selected</span></div>
        <div class="row"><label></label>
          <button class="danger" data-chaos="kill">Kill</button><button data-chaos="revive">Revive</button>
          <button data-chaos="slow">Slow 800 ms</button><button data-chaos="drop">Drop 30%</button>
          <button data-chaos="clear">Clear</button></div>
        <div class="row"><label>Gateway</label>
          <button class="danger" id="gwKill">Kill gateway</button><button id="gwRevive">Revive gateway</button></div>
        <div id="say"></div>
      </div>
    </div>
  </div>
  <div class="card"><h2>Group modules</h2>
    <div class="embeds">
      <iframe src="/colony/farzad/" title="Node module (farzad)" loading="lazy"></iframe>
      <iframe src="/colony/pisak/" title="Gateway (pisak)" loading="lazy"></iframe>
      <iframe src="/colony/platforms-tp/" title="Control (platforms-tp)" loading="lazy"></iframe>
    </div>
  </div>
</main>
<script src="sim.js"></script>
<script src="app.js"></script>
</body></html>
