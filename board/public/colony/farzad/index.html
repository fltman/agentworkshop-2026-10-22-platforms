<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>farzad: Node inspector</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Node inspector <span class="sub">NodeLink protocol, team farzad</span></h1>
  <div id="summary" class="summary"></div>
  <div id="stateErr" class="err"></div>
</header>

<main>
  <section class="card wide" id="internalsCard">
    <h2>Cluster internals <span class="hint">summed over all nodes</span></h2>
    <div id="internals" class="internals"></div>
    <div id="lastRun" class="lastRun"></div>
  </section>

  <section class="card" id="matrixCard">
    <h2>Link matrix <span class="hint">rows send, columns receive; click a row label</span></h2>
    <div class="matrixWrap"><table id="matrix" class="matrix"></table></div>
    <div id="legend" class="legend"></div>
  </section>

  <section class="card" id="nodeCard">
    <h2>Node <span id="nodeTitle" class="hint">pick a row in the matrix</span></h2>
    <div id="nodePanel"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
